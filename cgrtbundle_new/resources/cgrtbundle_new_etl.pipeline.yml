# The main pipeline for cgrtbundle_new

resources:
  pipelines:
    cgrtbundle_new_etl:
      name: cgrtbundle_new_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/cgrtbundle_new_etl"

      libraries:
        - glob:
            include: ../src/cgrtbundle_new_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
